name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing, and for provenance when publishing with a
  # token. This is what lets the runner mint a short lived OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm 11.5.1 or later, and Node 22 still
          # ships npm 10. Node 24 ships npm 11.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A warning rather than a failure, because there are two valid ways to
      # authenticate here and only one of them uses a secret.
      - name: Report how this will authenticate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is set. npm prefers OIDC when a trusted publisher is configured, and falls back to this token otherwise."
          else
            echo "::warning::No NPM_TOKEN, so this relies on trusted publishing."
            echo "If the publish step fails to authenticate, either:"
            echo "  configure a trusted publisher for this package on npmjs.com"
            echo "    (Package > Settings > Trusted Publisher > GitHub Actions,"
            echo "     repository tony-eneh/vercel-deploy-nogit, workflow release.yml)"
            echo "  or add an NPM_TOKEN repository secret."
          fi

      - run: npm test

      # Under trusted publishing, provenance is generated automatically and this
      # flag is redundant. It is kept so that a token based publish, which is the
      # fallback, still produces provenance.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
