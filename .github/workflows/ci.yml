name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: 

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here. It is where the rename failure mode the
        # park strategy has to survive actually happens.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && git --version
      - run: npm test
